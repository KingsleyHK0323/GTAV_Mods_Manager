# OpenAI-Codex_test_plan: Exercise isolated predicates without enabling the candidate.
name: Dependabot Policy Predicate Tests

on:
  pull_request:
    branches: [Source_Code]

permissions:
  contents: read

jobs:
  policy-predicates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      # This isolated check does not establish full-suite success or safe auto-merge.
      - name: Test isolated policy predicates
        run: node --test .github/scripts/dependabot-policy-direct.test.mjs
