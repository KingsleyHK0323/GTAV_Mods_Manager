name: Release

# OpenAI-Codex_Responsible: Source_Code
# OpenAI-Codex: Reuse the CI validation workflow before publishing installers.
# Builds real Tauri installers (Windows .msi/.exe, Linux .deb/.rpm) for
# gtavmm-app and publishes them as a GitHub Release, gated by the full test suite.
# Matches the project's "installer only, no portable/CLI-only release" policy (see the
# planning vault) — this replaces the earlier interim CLI-binary-only workflow that was
# a stand-in until gtavmm-app existed. Not code-signed (no certificate configured yet)
# — installers will show an "unknown publisher" warning on Windows/macOS until that's
# set up separately.

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  test-gate:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  build-and-publish:
    needs: test-gate
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - platform: windows-latest
          - platform: ubuntu-latest
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (Linux)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libdbus-1-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/gtavmm-app/src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: crates/gtavmm-app/package-lock.json

      - name: Install frontend dependencies
        working-directory: crates/gtavmm-app
        run: npm ci

      - name: Build and publish Tauri installers
        id: tauri_release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: crates/gtavmm-app
          # Installers only, per the project's release policy — AppImage is a portable
          # executable, not a traditional installer, so it's excluded on Linux.
          args: ${{ matrix.platform == 'ubuntu-latest' && '--bundles deb,rpm' || '' }}
          tagName: ${{ github.ref_name }}
          releaseName: "GTAV Mods Manager ${{ github.ref_name }}"
          releaseBody: "See CHANGELOG / commit history for details. Installers are unsigned — Windows SmartScreen / macOS Gatekeeper may warn on first run."
          generateReleaseNotes: true
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: false

      - name: Generate and attach installer SHA-256 checksums
        shell: bash
        env:
          ARTIFACT_PATHS: ${{ steps.tauri_release.outputs.artifactPaths }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          case "$RUNNER_OS" in
            Windows)
              platform=windows
              installer_extensions='[".msi", ".exe"]'
              ;;
            Linux)
              platform=linux
              installer_extensions='[".deb", ".rpm"]'
              ;;
            *)
              echo "Unsupported runner OS for installer checksums: $RUNNER_OS" >&2
              exit 1
              ;;
          esac

          checksum_file="SHA256SUMS-${platform}.txt"
          export CHECKSUM_FILE="$checksum_file"
          export INSTALLER_EXTENSIONS="$installer_extensions"

          node <<'NODE'
          const { createReadStream, writeFileSync } = require("node:fs");
          const { createHash } = require("node:crypto");
          const { basename, extname } = require("node:path");

          async function sha256(filePath) {
            const hash = createHash("sha256");
            for await (const chunk of createReadStream(filePath)) {
              hash.update(chunk);
            }
            return hash.digest("hex");
          }

          (async () => {
            const artifactPaths = JSON.parse(process.env.ARTIFACT_PATHS || "[]");
            const installerExtensions = new Set(
              JSON.parse(process.env.INSTALLER_EXTENSIONS),
            );
            const installers = artifactPaths
              .filter((filePath) =>
                installerExtensions.has(extname(filePath).toLowerCase()),
              )
              .sort((left, right) =>
                basename(left) < basename(right)
                  ? -1
                  : basename(left) > basename(right)
                    ? 1
                    : 0,
              );

            if (installers.length === 0) {
              throw new Error("No installer artifacts were reported by tauri-action.");
            }

            const lines = [];
            for (const installer of installers) {
              lines.push(`${await sha256(installer)}  ${basename(installer)}`);
            }

            writeFileSync(
              process.env.CHECKSUM_FILE,
              `${lines.join("\n")}\n`,
              "utf8",
            );
            console.log(`Generated ${process.env.CHECKSUM_FILE} for ${installers.length} installer(s).`);
          })().catch((error) => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE

          existing_assets="$(gh release view "$RELEASE_TAG" --repo "$GH_REPOSITORY" --json assets --jq '.assets[].name')"
          if printf '%s\n' "$existing_assets" | grep -Fxq "$checksum_file"; then
            existing_dir="$(mktemp -d)"
            gh release download "$RELEASE_TAG" --repo "$GH_REPOSITORY" --pattern "$checksum_file" --dir "$existing_dir"
            if cmp -s "$checksum_file" "$existing_dir/$checksum_file"; then
              echo "$checksum_file already exists with identical contents; skipping upload."
            else
              echo "$checksum_file already exists with different contents; refusing to replace the release asset." >&2
              exit 1
            fi
          else
            gh release upload "$RELEASE_TAG" "$checksum_file" --repo "$GH_REPOSITORY"
          fi

  publish-release:
    needs: build-and-publish
    permissions:
      contents: write
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPOSITORY: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Verify release assets and publish draft
        shell: bash
        run: |
          assets="$(gh release view "$RELEASE_TAG" --repo "$GH_REPOSITORY" --json assets --jq '.assets[].name')"

          for checksum_file in SHA256SUMS-windows.txt SHA256SUMS-linux.txt; do
            if ! printf '%s\n' "$assets" | grep -Fxq "$checksum_file"; then
              echo "Required checksum asset is missing: $checksum_file" >&2
              exit 1
            fi
          done

          if ! printf '%s\n' "$assets" | grep -Eiq '\.(msi|exe)$'; then
            echo "No Windows installer asset was found; leaving the release as a draft." >&2
            exit 1
          fi

          if ! printf '%s\n' "$assets" | grep -Eiq '\.(deb|rpm)$'; then
            echo "No Linux installer asset was found; leaving the release as a draft." >&2
            exit 1
          fi

          release_is_draft="$(gh release view "$RELEASE_TAG" --repo "$GH_REPOSITORY" --json isDraft --jq '.isDraft')"
          if [[ "$release_is_draft" != "true" ]]; then
            echo "Expected the release for $RELEASE_TAG to remain a draft; refusing to change its state." >&2
            exit 1
          fi

          gh release edit "$RELEASE_TAG" --repo "$GH_REPOSITORY" --draft=false
