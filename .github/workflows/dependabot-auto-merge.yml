name: Dependabot PR Merge

# OpenAI-Codex

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  check_suite:
    types: [completed]
  schedule:
    - cron: "17,47 * * * *"

permissions:
  actions: read
  contents: write
  pull-requests: write

jobs:
  merge-dependabot-pull-request:
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'pull_request') ||
      (github.event_name == 'check_suite' &&
       github.event.check_suite.conclusion == 'success') ||
      github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Merge eligible Dependabot pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node <<'NODE'
          const fs = require("node:fs");

          const apiBase = (process.env.GITHUB_API_URL || "https://api.github.com").replace(/\/$/, "");
          const repository = process.env.GITHUB_REPOSITORY;
          const token = process.env.GH_TOKEN;
          const repositoryPattern = /^[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+$/;
          const shaPattern = /^[0-9a-f]{40}$/i;

          async function request(path, options = {}) {
            const response = await fetch(apiBase + path, {
              method: options.method || "GET",
              headers: {
                Accept: "application/vnd.github+json",
                Authorization: "Bearer " + token,
                "X-GitHub-Api-Version": "2022-11-28",
                ...(options.body === undefined ? {} : { "Content-Type": "application/json" }),
              },
              ...(options.body === undefined ? {} : { body: JSON.stringify(options.body) }),
            });
            const responseText = await response.text();
            let data = null;
            if (responseText) {
              try {
                data = JSON.parse(responseText);
              } catch {
                throw new Error("GitHub returned a non-JSON response.");
              }
            }
            const acceptedStatuses = options.acceptStatuses || [];
            if (!response.ok && !acceptedStatuses.includes(response.status)) {
              throw new Error("GitHub API request failed with HTTP " + response.status + ".");
            }
            return options.withStatus ? { status: response.status, data } : data;
          }

          function singlePullRequestNumber(pullRequests) {
            if (!Array.isArray(pullRequests) || pullRequests.length !== 1) return null;
            const number = pullRequests[0]?.number;
            return Number.isSafeInteger(number) ? number : null;
          }

          async function scheduledPullRequestContexts(repositoryPath) {
            const pullRequests = [];
            for (let page = 1; ; page += 1) {
              const query = new URLSearchParams({
                state: "open",
                base: "Source_Code",
                per_page: "100",
                page: String(page),
              });
              const pagePullRequests = await request(repositoryPath + "/pulls?" + query.toString());
              if (!Array.isArray(pagePullRequests)) {
                throw new Error("GitHub returned an invalid open pull request list.");
              }
              pullRequests.push(...pagePullRequests);
              if (pagePullRequests.length < 100) break;
            }

            return pullRequests
              .filter(isEligiblePullRequest)
              .filter(
                (pullRequest) =>
                  Number.isSafeInteger(pullRequest.number) && shaPattern.test(pullRequest.head?.sha || ""),
              )
              .map((pullRequest) => ({
                pullRequestNumber: pullRequest.number,
                observedHeadSha: pullRequest.head.sha,
              }));
          }

          async function triggerContexts(event, repositoryPath) {
            const eventName = process.env.GITHUB_EVENT_NAME;
            if (eventName === "schedule") {
              const contexts = await scheduledPullRequestContexts(repositoryPath);
              console.log("Scheduled scan found " + contexts.length + " eligible Dependabot pull request(s).");
              return contexts;
            }

            if (event.repository?.full_name !== repository) {
              console.log("Skipping an event from another repository.");
              return [];
            }

            if (eventName === "workflow_run") {
              const runId = event.workflow_run?.id;
              if (!Number.isSafeInteger(runId)) {
                throw new Error("The completed workflow run ID is missing or invalid.");
              }
              const run = await request(repositoryPath + "/actions/runs/" + runId);
              if (
                run.name !== "CI" ||
                run.event !== "pull_request" ||
                run.status !== "completed" ||
                run.conclusion !== "success" ||
                run.repository?.full_name !== repository ||
                run.head_repository?.full_name !== repository ||
                !shaPattern.test(run.head_sha || "") ||
                !Number.isSafeInteger(run.workflow_id)
              ) {
                console.log("Skipping a run that is not a successful same-repository CI pull request.");
                return [];
              }
              const workflow = await request(repositoryPath + "/actions/workflows/" + run.workflow_id);
              if (workflow.name !== "CI" || workflow.path !== ".github/workflows/ci.yml") {
                console.log("Skipping a run that did not use the repository CI workflow file.");
                return [];
              }
              const pullRequestNumber = singlePullRequestNumber(run.pull_requests);
              if (pullRequestNumber === null) {
                console.log("Skipping a CI run that is not associated with exactly one pull request.");
                return [];
              }
              return [{ pullRequestNumber, observedHeadSha: run.head_sha }];
            }

            if (eventName === "check_suite") {
              const suite = event.check_suite;
              const pullRequestNumber = singlePullRequestNumber(suite?.pull_requests);
              if (
                suite?.conclusion !== "success" ||
                !shaPattern.test(suite?.head_sha || "") ||
                pullRequestNumber === null
              ) {
                console.log("Skipping a successful check suite without one valid pull request.");
                return [];
              }
              return [{ pullRequestNumber, observedHeadSha: suite.head_sha }];
            }

            console.log("Skipping an unsupported event.");
            return [];
          }

          async function disableExistingAutoMerge(repositoryPath, pullRequestNumber, expectedHeadSha) {
            const pullRequest = await request(repositoryPath + "/pulls/" + pullRequestNumber);
            if (!isEligiblePullRequest(pullRequest) || pullRequest.head?.sha !== expectedHeadSha) {
              console.log("Skipping native Auto-merge cancellation because the pull request changed.");
              return false;
            }
            if (!pullRequest.auto_merge) return true;

            const result = await request("/graphql", {
              method: "POST",
              body: {
                query:
                  "mutation DisableDependabotAutoMerge($input: DisablePullRequestAutoMergeInput!) { disablePullRequestAutoMerge(input: $input) { pullRequest { number } } }",
                variables: { input: { pullRequestId: pullRequest.node_id } },
              },
            });
            if (
              result.errors?.length ||
              result.data?.disablePullRequestAutoMerge?.pullRequest?.number !== pullRequest.number
            ) {
              throw new Error("GitHub did not disable an existing native auto-merge request.");
            }

            const updatedPullRequest = await request(repositoryPath + "/pulls/" + pullRequestNumber);
            if (!isEligiblePullRequest(updatedPullRequest) || updatedPullRequest.head?.sha !== expectedHeadSha) {
              console.log("Skipping merge because the pull request changed while disabling native Auto-merge.");
              return false;
            }
            if (updatedPullRequest.auto_merge) {
              throw new Error("GitHub still reports a native auto-merge request after disabling it.");
            }
            console.log("Disabled an existing native auto-merge request before applying the direct-merge checks.");
            return true;
          }

          function isEligiblePullRequest(pullRequest) {
            return (
              pullRequest.state === "open" &&
              !pullRequest.draft &&
              pullRequest.user?.login === "dependabot[bot]" &&
              pullRequest.base?.repo?.full_name === repository &&
              pullRequest.base?.ref === "Source_Code" &&
              pullRequest.head?.repo?.full_name === repository
            );
          }

          async function changedWorkflowFiles(repositoryPath, pullRequestNumber) {
            const changedFiles = [];
            for (let page = 1; page <= 30; page += 1) {
              const files = await request(
                repositoryPath + "/pulls/" + pullRequestNumber + "/files?per_page=100&page=" + page,
              );
              if (!Array.isArray(files)) {
                throw new Error("GitHub returned an invalid pull request file list.");
              }
              changedFiles.push(...files);
              if (files.length < 100) break;
              if (page === 30) {
                throw new Error("The changed file list exceeded the supported pagination limit.");
              }
            }

            const isWorkflowPath = (path) =>
              typeof path === "string" && (path === ".github/workflows" || path.startsWith(".github/workflows/"));
            return changedFiles.some(
              (file) => isWorkflowPath(file.filename) || isWorkflowPath(file.previous_filename),
            );
          }

          async function latestCiRunSucceeded(repositoryPath, pullRequestNumber, headSha) {
            const workflow = await request(repositoryPath + "/actions/workflows/ci.yml");
            if (
              workflow.name !== "CI" ||
              workflow.path !== ".github/workflows/ci.yml" ||
              !Number.isSafeInteger(workflow.id)
            ) {
              throw new Error("The repository CI workflow could not be verified.");
            }

            const runs = [];
            for (let page = 1; page <= 30; page += 1) {
              const query = new URLSearchParams({
                head_sha: headSha,
                event: "pull_request",
                per_page: "100",
                page: String(page),
              });
              const result = await request(
                repositoryPath + "/actions/workflows/" + workflow.id + "/runs?" + query.toString(),
              );
              if (!Array.isArray(result.workflow_runs)) {
                throw new Error("GitHub returned an invalid CI workflow run list.");
              }
              runs.push(...result.workflow_runs);
              if (result.workflow_runs.length < 100) break;
              if (page === 30) {
                throw new Error("The CI workflow run list exceeded the supported pagination limit.");
              }
            }

            const candidates = runs
              .filter(
                (run) =>
                  run.workflow_id === workflow.id &&
                  run.event === "pull_request" &&
                  run.head_sha === headSha &&
                  run.repository?.full_name === repository &&
                  run.head_repository?.full_name === repository &&
                  Array.isArray(run.pull_requests) &&
                  run.pull_requests.some((pullRequest) => pullRequest.number === pullRequestNumber),
              )
              .sort(
                (left, right) =>
                  (right.run_number || 0) - (left.run_number || 0) ||
                  (right.run_attempt || 1) - (left.run_attempt || 1),
              );

            const latestRun = candidates[0];
            return latestRun?.status === "completed" && latestRun.conclusion === "success";
          }

          async function processPullRequest(repositoryPath, context) {
            let pullRequest = await request(repositoryPath + "/pulls/" + context.pullRequestNumber);
            if (!isEligiblePullRequest(pullRequest)) {
              console.log("Skipping a pull request that is not an open same-repository Dependabot PR for Source_Code.");
              return;
            }
            if (pullRequest.head?.sha !== context.observedHeadSha) {
              console.log("Skipping a stale event before changing native Auto-merge state.");
              return;
            }

            if (!(await disableExistingAutoMerge(repositoryPath, context.pullRequestNumber, context.observedHeadSha))) {
              return;
            }
            pullRequest = await request(repositoryPath + "/pulls/" + context.pullRequestNumber);
            if (!isEligiblePullRequest(pullRequest)) {
              console.log("Skipping a pull request whose eligibility changed during processing.");
              return;
            }
            if (pullRequest.head?.sha !== context.observedHeadSha) {
              console.log("Skipping a stale event because the pull request head has changed.");
              return;
            }

            if (await changedWorkflowFiles(repositoryPath, pullRequest.number)) {
              console.log("Skipping a Dependabot pull request that adds, changes, renames, or removes workflow definitions.");
              return;
            }

            if (!(await latestCiRunSucceeded(repositoryPath, pullRequest.number, pullRequest.head.sha))) {
              console.log("Skipping a pull request without a successful latest CI run for its current head SHA.");
              return;
            }

            pullRequest = await request(repositoryPath + "/pulls/" + context.pullRequestNumber);
            if (!isEligiblePullRequest(pullRequest) || pullRequest.head?.sha !== context.observedHeadSha) {
              console.log("Skipping a pull request whose eligibility or head SHA changed before merge.");
              return;
            }

            if (!(await disableExistingAutoMerge(repositoryPath, context.pullRequestNumber, context.observedHeadSha))) {
              return;
            }
            pullRequest = await request(repositoryPath + "/pulls/" + context.pullRequestNumber);
            if (!isEligiblePullRequest(pullRequest) || pullRequest.head?.sha !== context.observedHeadSha) {
              console.log("Skipping a pull request whose eligibility or head SHA changed before merge.");
              return;
            }
            const mergeResult = await request(repositoryPath + "/pulls/" + pullRequest.number + "/merge", {
              method: "PUT",
              body: { sha: context.observedHeadSha, merge_method: "squash" },
              acceptStatuses: [404, 405, 409],
              withStatus: true,
            });

            if (mergeResult.status === 405) {
              console.log("GitHub did not permit the merge under the current repository rules; the PR remains open.");
              return;
            }
            if (mergeResult.status === 409) {
              console.log("The pull request head changed before merge; GitHub did not merge it.");
              return;
            }
            if (mergeResult.status === 404) {
              const currentPullRequest = await request(repositoryPath + "/pulls/" + pullRequest.number);
              if (currentPullRequest.merged) {
                console.log("The pull request was already merged by another actor.");
                return;
              }
              throw new Error("GitHub could not find the pull request during merge.");
            }
            if (mergeResult.status !== 200 || mergeResult.data?.merged !== true) {
              throw new Error("GitHub did not confirm that the pull request was merged.");
            }
            console.log("Merged Dependabot pull request #" + pullRequest.number + " through GitHub's standard merge API.");
          }

          async function main() {
            if (!token || !repository || !repositoryPattern.test(repository)) {
              throw new Error("The GitHub repository or workflow token is unavailable.");
            }

            const event = JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH, "utf8"));
            const repositoryPath = "/repos/" + repository;
            const contexts = await triggerContexts(event, repositoryPath);
            if (contexts.length === 0) return;

            let failedCandidates = 0;
            for (const context of contexts) {
              try {
                await processPullRequest(repositoryPath, context);
              } catch (error) {
                failedCandidates += 1;
                console.error("Failed to process Dependabot pull request #" + context.pullRequestNumber + ": " + error.message);
              }
            }
            if (failedCandidates > 0) {
              throw new Error("One or more eligible Dependabot pull requests could not be processed.");
            }
          }

          main().catch((error) => {
            console.error(error.message);
            process.exitCode = 1;
          });
          NODE
