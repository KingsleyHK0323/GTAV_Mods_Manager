# OpenAI-Codex: Shared validation workflow for branch checks and releases.
name: CI

on:
  push:
    branches: [Source_Code]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: crates/gtavmm-app/package-lock.json

      # OpenAI-Codex: Exercise the draft asset checks without live GitHub requests.
      - name: Test release draft asset checks
        run: node --test .github/scripts/prepare-release.test.mjs

      # OpenAI-Codex: Verify beta release checks in shared CI and the release gate.
      - name: Test public beta release checks
        run: node --test .github/scripts/prepare-beta-release.test.mjs

      - name: Install frontend dependencies
        working-directory: crates/gtavmm-app
        run: npm ci

      - name: Build frontend
        working-directory: crates/gtavmm-app
        run: npm run build

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        # libdbus-1-dev: keyring's sync-secret-service backend (ai_assistant's Linux
        # credential store) links against libdbus at build time via pkg-config.
        # The rest (webkit2gtk/gtk/glib/appindicator/rsvg/dbus dev headers): gtavmm-app
        # is a Tauri app and has been part of `cargo test --workspace`/`cargo build
        # --workspace` since it was scaffolded — this was missing from CI from that
        # point on (a real, previously-undetected gap: every Linux CI run since
        # 2026-08-27 failed at the `glib-sys` build script with "Package glib-2.0 was
        # not found", found while diagnosing the very first release workflow run).
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libdbus-1-dev pkg-config

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Build (workspace)
        run: cargo build --workspace --all-targets

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace
