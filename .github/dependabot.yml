# OpenAI-Codex_Responsible: Source_Code
version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "02:00"
      timezone: Asia/Hong_Kong

  - package-ecosystem: npm
    directory: "/crates/gtavmm-app"
    # OpenAI-Codex: Group related Vite version updates for review together.
    groups:
      vite-toolchain:
        applies-to: version-updates
        patterns:
          - "vite"
          - "@vitejs/plugin-react"
    schedule:
      interval: weekly
      day: monday
      time: "02:00"
      timezone: Asia/Hong_Kong

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "02:00"
      timezone: Asia/Hong_Kong
