# OpenAI-Codex
# OpenAI-Codex_Responsible: Source_Code
[workspace]
resolver = "2"
members = [
    "crates/gtavmm-core",
    "crates/gtavmm-cli",
    "crates/gtavmm-app/src-tauri",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "PolyForm-Noncommercial-1.0.0"
authors = ["SpaceSquare"]
repository = "https://github.com/KingsleyHK0323/GTAV_Mods_Manager"

[workspace.dependencies]
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quick-xml = "0.36"
zip = "2"
sevenz-rust = "0.6"
rars = { version = "=0.12.3", default-features = false }
thiserror = "2"
anyhow = "1"
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
directories = "5"
chrono = { version = "0.4", features = ["serde"] }
walkdir = "2"
tempfile = "3"
clap = { version = "4", features = ["derive"] }
keyring = "3"
rpf-archive = "0.7"

[workspace.dependencies.winreg]
version = "0.52"

[workspace.dependencies.ureq]
version = "2"
default-features = false
features = ["tls", "json"]

[workspace.dependencies.rust_xlsxwriter]
version = "0.79"
